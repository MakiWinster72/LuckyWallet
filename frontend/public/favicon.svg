<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LuckyWallet premium banking icon</title>
  <desc id="desc">A luxury wallet icon in deep plum and brushed gold with a four-leaf clover emblem.</desc>

  <defs>
    <linearGradient id="bg" x1="160" y1="110" x2="860" y2="910" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#613252"/>
      <stop offset="0.45" stop-color="#49243e"/>
      <stop offset="1" stop-color="#24111f"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="32%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".22"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset=".28" stop-color="#e7c27d"/>
      <stop offset=".58" stop-color="#b47a34"/>
      <stop offset=".82" stop-color="#f0d39a"/>
      <stop offset="1" stop-color="#8d5a22"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e4b7"/>
      <stop offset="1" stop-color="#c58b47"/>
    </linearGradient>
    <linearGradient id="wallet" x1="250" y1="310" x2="790" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b385a"/>
      <stop offset=".42" stop-color="#49243e"/>
      <stop offset="1" stop-color="#2a1425"/>
    </linearGradient>
    <linearGradient id="walletEdge" x1="200" y1="220" x2="820" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8f5b79"/>
      <stop offset=".55" stop-color="#3b1d33"/>
      <stop offset="1" stop-color="#180b15"/>
    </linearGradient>
    <linearGradient id="cardPlum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b4869"/>
      <stop offset="1" stop-color="#32192d"/>
    </linearGradient>
    <linearGradient id="cardGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d3"/>
      <stop offset="1" stop-color="#c88f51"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#140a12" flood-opacity=".46"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#180b15" flood-opacity=".38"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dy="-3" result="off"/>
      <feComposite in="off" in2="SourceAlpha" operator="out" result="inner"/>
      <feColorMatrix in="inner" type="matrix"
        values="1 0 0 0 1
                0 1 0 0 0.85
                0 0 1 0 0.65
                0 0 0 .22 0"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <clipPath id="appClip">
      <rect x="44" y="44" width="936" height="936" rx="218"/>
    </clipPath>
  </defs>

  <g clip-path="url(#appClip)">
    <rect x="44" y="44" width="936" height="936" rx="218" fill="url(#bg)"/>
    <rect x="44" y="44" width="936" height="936" rx="218" fill="url(#bgGlow)"/>
    <path d="M112 300C260 152 462 104 690 142C807 161 898 214 964 286"
          fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="3"/>
    <path d="M77 724C242 844 442 903 671 877C798 863 899 816 968 750"
          fill="none" stroke="#d8b06b" stroke-opacity=".08" stroke-width="2"/>

    <g filter="url(#shadow)">
      <path d="M258 362C258 319 293 284 336 284H722C773 284 815 326 815 377V738C815 789 773 831 722 831H330C281 831 241 791 241 742V391C241 375 247 365 258 362Z"
            fill="url(#walletEdge)" stroke="#a16b87" stroke-opacity=".45" stroke-width="4"/>

      <g filter="url(#softShadow)">
        <rect x="336" y="244" width="333" height="259" rx="42"
              transform="rotate(-9 336 244)"
              fill="url(#cardPlum)" stroke="#c694ae" stroke-opacity=".35" stroke-width="4"/>
        <rect x="387" y="315" width="335" height="212" rx="36"
              transform="rotate(-2 387 315)"
              fill="url(#cardGold)" stroke="#fff4d3" stroke-opacity=".65" stroke-width="4"/>
        <path d="M423 355H632" stroke="#7b482d" stroke-opacity=".28" stroke-width="14" stroke-linecap="round"/>
      </g>

      <g filter="url(#softShadow)">
        <circle cx="703" cy="322" r="115" fill="url(#gold)" stroke="#fff0c3" stroke-width="5"/>
        <circle cx="703" cy="322" r="91" fill="#7f4b31" fill-opacity=".44" stroke="#8a562f" stroke-width="4"/>
        <circle cx="703" cy="322" r="78" fill="url(#goldSoft)" opacity=".96"/>
      </g>

      <rect x="228" y="403" width="598" height="438" rx="82"
            fill="url(#wallet)" stroke="#8b5674" stroke-width="5"/>
      <path d="M251 441C289 408 328 397 389 397H708C758 397 797 407 824 438"
            fill="none" stroke="#d7a0b9" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/>
      <path d="M278 464C306 443 342 434 386 434H681"
            fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="18" stroke-linecap="round"/>
      <path d="M284 456V754C284 780 305 802 332 802H719"
            fill="none" stroke="#d9a9be" stroke-opacity=".54" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="14 13"/>

      <path d="M737 548H824C861 548 891 578 891 615V701C891 738 861 768 824 768H737C694 768 660 733 660 691V625C660 582 694 548 737 548Z"
            fill="url(#wallet)" stroke="#94607b" stroke-width="5"/>
      <path d="M744 581H812C837 581 857 601 857 626V691C857 716 837 736 812 736H744C716 736 693 713 693 685V632C693 604 716 581 744 581Z"
            fill="#3d1f35" stroke="#c796ad" stroke-opacity=".35" stroke-width="3"/>
      <circle cx="792" cy="658" r="43" fill="url(#gold)" stroke="#fff1c3" stroke-width="4"/>
      <circle cx="792" cy="658" r="25" fill="#d69f58" opacity=".42"/>

      <g transform="translate(521 629)" filter="url(#innerGlow)">
        <path d="M0-8 C-57-73-136-24-93 42 C-52 103-10 48 0 29 C10 48 52 103 93 42 C136-24 57-73 0-8Z"
              fill="url(#gold)" stroke="#8b5927" stroke-width="5"/>
        <path d="M0 18C-3 82-10 120-35 157"
              fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round"/>
        <path d="M-2 23C-8 72-14 111-34 145"
              fill="none" stroke="#fff0c0" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
      </g>

      <g transform="translate(703 322) scale(.58)">
        <path d="M0-8 C-57-73-136-24-93 42 C-52 103-10 48 0 29 C10 48 52 103 93 42 C136-24 57-73 0-8Z"
              fill="#7c4b2f" opacity=".92"/>
        <path d="M0 18C-3 82-10 120-35 157"
              fill="none" stroke="#7c4b2f" stroke-width="20" stroke-linecap="round"/>
      </g>
    </g>

    <path d="M140 112C313 58 634 57 831 133C884 154 928 187 958 225"
          fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="18" stroke-linecap="round"/>
  </g>

  <rect x="44" y="44" width="936" height="936" rx="218"
        fill="none" stroke="url(#gold)" stroke-width="6"/>
  <rect x="56" y="56" width="912" height="912" rx="206"
        fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="2"/>
</svg>
